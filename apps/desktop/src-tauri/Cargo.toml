[package]
name = "odontologia-desktop"
version = "0.1.0"
description = "Sistema de Gestión Odontológica — aplicación de escritorio (Tauri)"
authors = ["consultorio"]
edition = "2021"

# La app de escritorio es un wrapper de apps/web: no tiene lógica de
# negocio propia (SDD §2.1). Solo empaqueta la webview y la configuración.
[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
