name: odontologia-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: odontologia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: odontologia
      POSTGRES_PASSWORD: odontologia
      POSTGRES_DB: odontologia
      TZ: America/Argentina/Buenos_Aires
    ports:
      - "5432:5432"
    volumes:
      - odontologia_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odontologia -d odontologia"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Object Storage compatible con S3 (solo para desarrollo).
  # El proveedor de producción se define en docs/ADR.md.
  minio:
    image: minio/minio:latest
    container_name: odontologia-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - odontologia_miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  odontologia_pgdata:
  odontologia_miniodata:
