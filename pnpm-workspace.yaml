packages:
  - 'apps/*'
  - 'packages/*'

# Dependencias con scripts de instalación propios que deben ejecutarse.
allowBuilds:
  '@prisma/engines': true
  '@swc/core': true
  argon2: true
  esbuild: true
  prisma: true
  workerd: true
  # Telemetría de terceros: nunca corre en este proyecto (política de seguridad).
  '@scarf/scarf': false
