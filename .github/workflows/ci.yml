name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  TZ: America/Argentina/Buenos_Aires
  # Los specs de Vitest (apps/api) requieren BD migrada + seed; el .env no
  # existe en CI, así que la URL sale del workflow (fase 12).
  DATABASE_URL: postgresql://odontologia:odontologia@localhost:5432/odontologia_ci?schema=public

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: odontologia
          POSTGRES_PASSWORD: odontologia
          POSTGRES_DB: odontologia_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # La versión se toma de "packageManager" en package.json.

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Migraciones y seed
        run: |
          pnpm exec prisma migrate deploy
          pnpm db:seed

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build
